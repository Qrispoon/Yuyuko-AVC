name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows-only project (path semantics and cmd scripts are Windows-specific).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      # Report-only coverage (built into Node; no third-party tooling).
      - name: Test coverage (report only)
        run: npm run test:coverage

      - name: Release consistency checks
        run: node tools/check-release.mjs
