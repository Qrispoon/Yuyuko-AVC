name: Bug report
description: 报告可复现的问题（请先搜索已有 Issue）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请确认：
        1. 已搜索过已有 Issue；
        2. 已用最新 Release 复现；
        3. **不要**上传影片文件、封面、真实字幕或含个人路径的截图。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 版本或 commit
      placeholder: "v0.5.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Windows 版本 + Node 版本（源码运行时）
      placeholder: "Windows 11 23H2 / Node 24.10.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择目录
        2. 点击扫描
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 日志
      description: 贴关键日志或 `doctor` 输出；请先替换掉路径中的用户名与代理地址
      render: text
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认这不是"求片源/求账号/代爬"类请求
          required: true
        - label: 我确认附件不含真实影片、封面或个人敏感信息
          required: true
