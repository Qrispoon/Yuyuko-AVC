name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      coverage:
        description: 'Collect coverage on Node 24 (runs the suite once more)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    # Windows-only project (path semantics and cmd scripts are Windows-specific).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      # Optional diagnostic run; avoid repeating the full suite on every matrix job.
      - name: Test coverage (report only)
        if: github.event_name == 'workflow_dispatch' && inputs.coverage && matrix.node == '24'
        run: npm run test:coverage
