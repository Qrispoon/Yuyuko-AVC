      <p class="eyebrow"><span></span> 白玉楼的春日</p>
      <h1>一笔<br>春色</h1>
      <p class="roman">A moment, in bloom.</p>
      <p class="description">从一缕线条，到满纸春色。<br>让颜色，沿着笔迹慢慢盛开。</p>

        <button type="button" class="chapter active" data-time="0" aria-current="step"><span>01</span><span>落笔 · 逐线勾勒</span><i aria-hidden="true"></i></button>
        <button type="button" class="chapter" data-time="2.9"><span>02</span><span>入色 · 水彩晕染</span><i aria-hidden="true"></i></button>
        <button type="button" class="chapter" data-time="5.5"><span>03</span><span>叠映 · 光影浮现</span><i aria-hidden="true"></i></button>
        <button type="button" class="chapter" data-time="8.0"><span>04</span><span>成画 · 春意渐浓</span><i aria-hidden="true"></i></button>
      </nav>
      <div class="readiness" role="status" aria-live="polite"><span class="status-dot"></span><span id="status">正在备好画卷…</span></div>
      <p class="demo-note" id="demo-note">独立动画预览 · 完成后停留，供你细看</p>
    </section>
    <figure class="art-space">
      <div class="art-holder" id="art-holder" role="img" aria-label="西行寺幽幽子的水彩绘制过程：逐笔描线、遮罩晕染与精细成画">

        <div class="finish-layer" id="finish-layer"><img id="painting" src="assets/painting.png" width="915" height="1330" alt="" decoding="async" fetchpriority="high"></div>
