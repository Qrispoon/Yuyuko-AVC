name: Feature request
description: 提出功能建议（请先搜索已有 Issue / Roadmap）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认这个建议**不涉及**：内置片源/账号/代理池、破解/去 DRM、在线刮削服务、大规模重写。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述使用场景与痛点，而不是只给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 现有 workaround
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 建议不涉及片源/账号/代理池/破解
          required: true
